# =============================================================================
# nginx.conf — Main Nginx configuration
# Project : RabTech Academy Internship — Task 05
#           Linux Server Administration & Nginx Reverse Proxy
# Role    : Global settings, gzip, proxy cache, rate-limit zone and logging.
#           The virtual host itself lives in sites-available/app.conf and is
#           symlinked into sites-enabled/ by setup-server.sh.
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {

    # ------------------------------------------------------------------
    # Basic settings
    # ------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;                      # do not leak the Nginx version

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ------------------------------------------------------------------
    # Logging — global defaults; the app vhost defines its own files
    # (access_log /var/log/nginx/app.access.log, error log likewise).
    # ------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # Rate limiting zone (shared memory). 10 MB stores ~160k states;
    # the rate of 10 requests/second per client IP is enforced in the
    # app location of sites-available/app.conf via limit_req.
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=app_limit:10m rate=10r/s;
    limit_req_log_level warn;
    limit_req_status 429;

    # ------------------------------------------------------------------
    # Proxy cache — static/GET responses from the app can be cached on
    # disk for up to 60 minutes of inactive time, 1 GB maximum.
    # ------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/app_cache
                     levels=1:2
                     keys_zone=app_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # Sensible proxy timeouts shared by all vhosts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ------------------------------------------------------------------
    # Virtual hosts
    # ------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
