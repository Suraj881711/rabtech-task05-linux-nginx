# =============================================================================
# app.conf — Virtual host: reverse proxy to the local application
# Project : RabTech Academy Internship — Task 05
# App     : local service listening on 127.0.0.1:8000 (see upstream below)
# Install : /etc/nginx/sites-available/app.conf
#           symlink -> /etc/nginx/sites-enabled/app.conf (done by setup script)
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream — the application server on the same machine.
# keepalive reuses connections to the backend for lower latency.
# ---------------------------------------------------------------------------
upstream app_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP (port 80) — redirect everything to HTTPS.
# ACME challenges are still served so Certbot renewals keep working.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com www.example.com;

    # Let's Encrypt HTTP-01 challenge (Certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (port 443) — TLS termination + reverse proxy.
# Certificates: Let's Encrypt via Certbot (paths below). In a sandbox a
# self-signed pair can be generated instead — see docs/server-administration.md
# and the commented block in setup-server.sh.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # --- TLS ------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Logs ------------------------------------------------------------
    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    # --- Security headers (all responses) --------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    # --- Static assets: long-lived browser caching ------------------------
    # Files under /static/ are served by the app but are safe to cache
    # aggressively because their URLs are versioned/fingerprinted.
    location /static/ {
        proxy_pass http://app_backend;
        proxy_cache app_cache;
        proxy_cache_valid 200 301 302 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Security headers must be repeated here: add_header in a location
        # replaces (does not merge with) the server-level ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # --- Application: reverse proxy + rate limiting -----------------------
    location / {
        # Rate limiting — zone defined in nginx.conf (10 r/s per IP),
        # short bursts of 20 are queued instead of rejected outright.
        limit_req zone=app_limit burst=20 nodelay;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Dynamic HTML/API responses: no shared caching, let the app
        # control freshness itself.
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Health check endpoint: never rate-limited, never cached ---------
    location = /health {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
